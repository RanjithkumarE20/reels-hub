<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <title>Reels Hub</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="bar">
        <div class="brand">Reels<span>Hub</span></div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-feed="quotes" class="tab active">Quotes <small>& songs</small></button>
          <button role="tab" data-feed="news" class="tab">Trending</button>
        </nav>
        <button class="icon-btn" id="soundBtn" title="Sound on/off" aria-label="Toggle sound">🔇</button>
      </div>
      <div class="stories" id="stories" aria-label="Stories"></div>
    </header>

    <div class="stage">
      <main class="feed" id="feed" aria-live="polite"></main>
      <div class="live" id="live"><i></i><span>Live</span></div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="start" id="start">
      <div class="start-card">
        <div class="logo">▶</div>
        <h1>Reels Hub</h1>
        <p>English quotes with matching Tamil, Hindi &amp; English songs, plus the latest trending news, all in reels and stories that update by themselves.</p>
        <button id="startBtn">Tap to start with sound</button>
        <button class="ghost" id="startMuted">Continue muted</button>
      </div>
    </div>
  </div>

  <!-- story viewer -->
  <div class="viewer" id="viewer" hidden>
    <div class="v-progress" id="vProgress"></div>
    <div class="v-head">
      <img id="vAvatar" alt="" />
      <div><b id="vTitle"></b><small id="vTime"></small></div>
      <button class="icon-btn" id="vClose" aria-label="Close">✕</button>
    </div>
    <div class="v-stage" id="vStage"></div>
    <button class="v-nav prev" id="vPrev" aria-label="Previous"></button>
    <button class="v-nav next" id="vNext" aria-label="Next"></button>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
